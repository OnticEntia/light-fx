start:
  target:
    entity:
      domain: light
  fields:
    effect:
      required: true
      example: rainbow
      selector:
        select:
          options:
            - colorloop
            - rainbow
            - party
            - breathe
            - aurora
            - ocean
            - candle
            - fireplace
            - police
            - pulse
            - sunrise
            - sunset
    speed:
      default: 1
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: slider
    brightness:
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    color:
      selector:
        color_rgb:

stop:
  target:
    entity:
      domain: light
  fields:
    restore:
      default: true
      selector:
        boolean:
